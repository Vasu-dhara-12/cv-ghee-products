apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: cv-ghee-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-ghee-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-ghee-backend
  template:
    metadata:
      labels:
        app: cv-ghee-backend
    spec:
      containers:
        - name: backend
          image: vasudhara12/cv-ghee-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-ghee-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-ghee-frontend
  template:
    metadata:
      labels:
        app: cv-ghee-frontend
    spec:
      containers:
        - name: frontend
          image: vasudhara12/cv-ghee-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: cv-ghee-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
  type: LoadBalancer
